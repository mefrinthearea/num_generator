<!DOCTYPE html>
<html lang="en">

<head>
    <!-- ====== Meta Information ====== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ====== Page Title ====== -->
    <title>Random Number Generator</title>
    
    <!-- ====== Stylesheet ====== -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- ====== Main Container ====== -->
    <div class="container">
        
        <!-- Page Heading -->
        <h1>Number Generator</h1>

        <!-- Display Area for Generated Number -->
        <div id="number-display">0</div>

        <!-- Input Fields for Min and Max Values -->
        <input type="number" id="min" placeholder="Min">
        <input type="number" id="max" placeholder="Max">

        <!-- Generate Button -->
        <button id="generate-btn">Generate Number</button>
        
    </div>

    <!-- ====== JavaScript File ====== -->
    <script src="script.js"></script>
</body>

</html>
